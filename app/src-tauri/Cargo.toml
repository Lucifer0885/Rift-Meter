[package]
name = "dso-dps-meter"
version = "0.1.0"
description = "Passive DPS meter for Drakensang Online"
license = "MIT"
edition = "2024"
rust-version = "1.90"
default-run = "dso-dps-meter"

[lib]
name = "dso_dps_meter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dso-dps-meter"
path = "src/main.rs"

# Replays a saved .pcapng through the decoder and prints hits (for testing).
[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
regex = "1"
libloading = "0.8"
tauri-plugin-global-shortcut = "2"
